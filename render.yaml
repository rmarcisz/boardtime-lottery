services:
  - type: web
    name: boardtimes-lottery
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boardtimes-lottery-db
          property: connectionString

databases:
  - name: boardtimes-lottery-db
    plan: free
